<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vkusno catering</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="logo-inner">
          <a href="#"
            ><img src="./assets/img/logo/logo.svg" alt="logotype"
          /></a>
        </div>
        <div class="header__block">
          <p>Кейтеринг под ключ с обслуживанием в Москве и МО</p>
        </div>
        <div class="header__block">

        </div>
        <div class="social-links header__block">
          <div class="social-link-item">
            <a href="#"
              ><img src="./assets/img/icons/social/mail.svg" alt=""

          </div>
          <div class="social-link-item">
            <a href="#"
              ><img src="./assets/img/icons/social/whats-app.svg" alt=""
            /></a>
          </div>
          <div class="social-link-item">
            <a href="#"
              ><img src="./assets/img/icons/social/telegram.svg" alt=""
            /></a>
          </div>
        </div>
        <div class="header__block">
          <button class="button">Заказать звонок</button>
        </div>
        <div class="header__block">
          <div class=""><a href="#">8 (499) 257 00 00</a></div>
          <p>Работаем в Москве и Московской области</p>
        </div>
      </header>
    </div>

  <script src="./js/index.js"></script>
